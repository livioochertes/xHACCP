    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .loading-text {
      color: white;
      font-size: 18px;
      font-weight: 600;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      line-height: 1.6;
      color: #333;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

    }
    
    .container {

      margin: 0;
      padding: 10px 16px;
    }

      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 50px;
      border-radius: 20px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.2);

    .login-header {

      text-align: center;

      border-top: 4px solid white;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;

    @keyframes spin {
      0% { transform: rotate(0deg); }

    }

      50% { opacity: 0.5; }

    .image-upload-zone:hover {

    .image-thumbnail {

  <!-- Initial loading overlay -->
  <div id="initial-loading" class="initial-loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading xHACCP Admin Panel...</div>
  </div>
  
  <div id="admin-root"></div>

  <!-- Hide loading overlay as soon as React mounts content into #admin-root -->
  <script>
    // MutationObserver: hides overlay immediately when React renders anything
    var adminOverlayHidden = false;
    function hideAdminOverlay() {
      if (adminOverlayHidden) return;
      adminOverlayHidden = true;
      var overlay = document.getElementById('initial-loading');
      if (overlay) overlay.classList.add('hidden');
    }

    document.addEventListener('DOMContentLoaded', function() {
      var root = document.getElementById('admin-root');
      if (!root) return;
      var observer = new MutationObserver(function(mutations) {
        for (var i = 0; i < mutations.length; i++) {
          if (mutations[i].addedNodes.length > 0) {
            hideAdminOverlay();
            observer.disconnect();
            break;
          }
        }
      });
      observer.observe(root, { childList: true, subtree: true });
    });

    // Hard timeout fallback: if nothing mounted after 20s, show error
    setTimeout(function() {
      var overlay = document.getElementById('initial-loading');
      if (overlay && !overlay.classList.contains('hidden')) {
        overlay.innerHTML = [
          '<div style="text-align:center;padding:40px">',
          '<div style="font-size:48px;margin-bottom:20px">&#9888;&#65039;</div>',
          '<div style="color:white;font-size:22px;font-weight:700;margin-bottom:12px">Panoul de administrare nu s-a incarcat</div>',
          '<div style="color:rgba(255,255,255,0.85);font-size:15px;margin-bottom:24px">',
          'Compilarea scripturilor a durat prea mult sau a aparut o eroare.<br>',
          'Deschideti consola browserului (F12) pentru detalii.',
          '</div>',
          '<button onclick="location.reload()" style="background:white;color:#764ba2;border:none;padding:12px 28px;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer">',
          '&#8635; Reincarcare pagina',
          '</button>'
        ].join('');
      }
    }, 20000);
  </script>

    window.AT = function(txt) {
      var dict = T[window.ADMIN_LANG];
      if (!dict) return txt;
      return dict[txt] !== undefined ? dict[txt] : txt;
    };

    window.setAdminLang = function(lang) {
      localStorage.setItem('adminLang', lang);
      location.reload();
    };

    /* ── MutationObserver: translatează textul din DOM după ce React rendă ── */
    if (window.ADMIN_LANG && window.ADMIN_LANG !== 'ro') {
      document.addEventListener('DOMContentLoaded', function() {
        var dict = T[window.ADMIN_LANG] || {};
        var keys = Object.keys(dict);
        if (!keys.length) return;

        /* sortăm cheile descrescător după lungime — mai întâi fraze lungi */
        keys.sort(function(a,b){ return b.length - a.length; });

        function translateTextNode(node) {
          if (node.nodeType !== 3) return;
          var val = node.nodeValue;
          if (!val || !val.trim()) return;
          var trimmed = val.trim();
          for (var i = 0; i < keys.length; i++) {
            var k = keys[i];
            if (trimmed === k || val.indexOf(k) !== -1) {
              var translated = dict[k];
              if (translated && translated !== k) {
                node.nodeValue = val.replace(k, translated);
                return; /* o singură înlocuire pe nod */
              }
            }
          }
        }

        function walkNode(node) {
          if (!node) return;
          if (node.nodeType === 3) {
            translateTextNode(node);
          } else if (node.nodeType === 1 && node.childNodes) {
            /* nu traducem input-uri, textarea, script, style */
            var tag = node.tagName ? node.tagName.toLowerCase() : '';
            if (tag === 'script' || tag === 'style' || tag === 'input' || tag === 'textarea') return;
            for (var i = 0; i < node.childNodes.length; i++) {
              walkNode(node.childNodes[i]);
            }
          }
        }

        var pending = false;
        function schedTranslate() {
          if (pending) return;
          pending = true;
          requestAnimationFrame(function() {
            pending = false;
            walkNode(document.body);
          });
        }

        var obs = new MutationObserver(function(mutations) {
          for (var i = 0; i < mutations.length; i++) {
            var m = mutations[i];
            if (m.type === 'characterData') {
              translateTextNode(m.target);
            } else if (m.addedNodes && m.addedNodes.length) {
              schedTranslate();
              return;
            }
          }
        });
        obs.observe(document.body, { childList: true, subtree: true, characterData: true });

        /* prima rulare după încărcarea inițială */
        setTimeout(schedTranslate, 300);
        setTimeout(schedTranslate, 800);
        setTimeout(schedTranslate, 2000);
      });
    }
  })();
  </script>
